name: Linux Ascend client checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client dependencies
        run: python -m pip install -r requirements-ascend.txt
      - name: Check Bash entry
        run: |
          bash -n run_ascend.sh
          bash -n run_dabs_existing.sh
          bash -n run_dabs_r234.sh
      - name: Run CPU tests and frozen-source integrity checks
        run: bash run_ascend.sh test
      - name: Verify pinned native patch sources and anchors (no NPU)
        run: python tools/check_native_upstream.py
      - name: Validate existing-service plan without Docker or model files
        run: python tools/run_dabs_existing.py plan --devices 4,5 --suite smoke
      - name: Validate the new 96-condition plan
        run: python tools/run_dabs_existing.py plan --devices 0,1,2,3 --suite r234
      - name: Run supplied R234 CPU checks with untouched source
        run: bash source/spra_workflow_fullgrid_r234_sll_v1/run_checks.sh
